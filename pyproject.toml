[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dot-rec"
version = "0.1.0"
description = "Independent BAST research candidate; no validated performance claims"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.6,<3"]

[tool.setuptools.packages.find]
where = ["."]
include = ["model*", "common*", "utils*"]
